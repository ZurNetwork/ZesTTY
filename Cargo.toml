[workspace]
members = [".", "crates/zestty-napi", "crates/zts-fmt"]

[package]
name = "zestty"
version = "0.4.0"
edition = "2024"

[lib]
name = "zestty"
path = "src/lib.rs"

[[bin]]
name = "zestty"
path = "src/main.rs"

[dependencies]
anyhow = "1"
swc_common = { path = "../swc_rustify/crates/swc_common", features = [
  "tty-emitter",
  "sourcemap",
] }
swc_atoms = { path = "../swc_rustify/crates/swc_atoms" }
swc_ecma_ast = { path = "../swc_rustify/crates/swc_ecma_ast" }
swc_ecma_parser = { path = "../swc_rustify/crates/swc_ecma_parser", features = [
  "typescript",
] }
swc_ecma_visit = { path = "../swc_rustify/crates/swc_ecma_visit" }
swc_ecma_codegen = { path = "../swc_rustify/crates/swc_ecma_codegen" }
swc_ecma_utils = { path = "../swc_rustify/crates/swc_ecma_utils" }
swc_ecma_transforms_base = { path = "../swc_rustify/crates/swc_ecma_transforms_base" }

[dev-dependencies]
insta = { version = "1", features = ["glob"] }
swc_sourcemap = { path = "../swc_rustify/crates/swc_sourcemap" }
