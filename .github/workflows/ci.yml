name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ZesTTY path-depends on the swc fork as a SIBLING directory
# (../swc_rustify), and since Phase 7 on the zts-fmt formatter forks
# under ../zts-fmt-forks/* (dprint-plugin-typescript + deno_ast +
# dprint-swc-ext, ZurNetwork forks, zts branches) — so every job checks
# out all five repos side by side and runs from the ZesTTY subdirectory.

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ZesTTY
    steps:
      - uses: actions/checkout@v4
        with:
          path: ZesTTY
      - uses: actions/checkout@v4
        with:
          repository: ProgrammingCheetah/swc_rustify
          ref: zts
          path: swc_rustify
      - uses: actions/checkout@v4
        with:
          repository: ZurNetwork/dprint-plugin-typescript
          ref: zts
          path: zts-fmt-forks/dprint-plugin-typescript
      - uses: actions/checkout@v4
        with:
          repository: ZurNetwork/deno_ast
          ref: zts
          path: zts-fmt-forks/deno_ast
      - uses: actions/checkout@v4
        with:
          repository: ZurNetwork/dprint-swc-ext
          ref: zts
          path: zts-fmt-forks/dprint-swc-ext
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # NOT --all: that reaches through the path-deps into the swc fork,
      # whose .rustfmt.toml uses nightly-only options — stable rustfmt then
      # disagrees with the fork's committed formatting.
      - run: cargo fmt --check -p zestty -p zestty-napi -p zts-fmt
      - run: npm ci
      - run: npm run format:check

  lint:
    name: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ZesTTY
    steps:
      - uses: actions/checkout@v4
        with:
          path: ZesTTY
      - uses: actions/checkout@v4
        with:
          repository: ProgrammingCheetah/swc_rustify
          ref: zts
          path: swc_rustify
      - uses: actions/checkout@v4
        with:
          repository: ZurNetwork/dprint-plugin-typescript
          ref: zts
          path: zts-fmt-forks/dprint-plugin-typescript
      - uses: actions/checkout@v4
        with:
          repository: ZurNetwork/deno_ast
          ref: zts
          path: zts-fmt-forks/deno_ast
      - uses: actions/checkout@v4
        with:
          repository: ZurNetwork/dprint-swc-ext
          ref: zts
          path: zts-fmt-forks/dprint-swc-ext
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ZesTTY
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ZesTTY
    steps:
      - uses: actions/checkout@v4
        with:
          path: ZesTTY
      - uses: actions/checkout@v4
        with:
          repository: ProgrammingCheetah/swc_rustify
          ref: zts
          path: swc_rustify
      - uses: actions/checkout@v4
        with:
          repository: ZurNetwork/dprint-plugin-typescript
          ref: zts
          path: zts-fmt-forks/dprint-plugin-typescript
      - uses: actions/checkout@v4
        with:
          repository: ZurNetwork/deno_ast
          ref: zts
          path: zts-fmt-forks/deno_ast
      - uses: actions/checkout@v4
        with:
          repository: ZurNetwork/dprint-swc-ext
          ref: zts
          path: zts-fmt-forks/dprint-swc-ext
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ZesTTY
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build:native
      - run: cargo test --workspace
      - run: npm test
